name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: pip install pandas numpy scikit-learn xgboost optuna matplotlib
      - run: PYTHONPATH=. python -m unittest ingestion.test_ingestion agents.test_graph eval.test_eval ml.test_train backend.test_app

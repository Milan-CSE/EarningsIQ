[project]
name = "earningsiq"
version = "0.1.0"
description = "Multi-agent earnings research desk. Not investment advice."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "pandas",
  "numpy",
  "scikit-learn",
  "xgboost",
  "optuna",
  "matplotlib",
]

[project.optional-dependencies]
api = ["fastapi", "uvicorn", "pydantic"]
eval = ["ragas", "deepeval"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
